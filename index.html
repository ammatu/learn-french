<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c 0%, #0d1b3e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .category-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-btn {
            padding: 10px 20px;
            background: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .category-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .category-btn.active {
            background: #ffd700;
            font-weight: bold;
        }

        .card-container {
            perspective: 1000px;
            margin-bottom: 20px;
        }

        .flashcard {
            width: 450px;
            min-height: 320px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
            padding: 30px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border-radius: 20px;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #f0f0f0;
        }

        .word {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }

        .pronunciation {
            font-size: 1.3em;
            color: #888;
            font-style: italic;
            margin-bottom: 20px;
        }

        .translate-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .translate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            background: #ff5252;
        }

        .hint {
            font-size: 1em;
            color: #666;
            margin-top: 10px;
        }

        .translation {
            font-size: 2.5em;
            color: #764ba2;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-weight: 600;
        }

        .btn-prev {
            background: #64b5f6;
            color: white;
        }

        .btn-next {
            background: #64b5f6;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .progress {
            color: white;
            font-size: 1.2em;
            margin-bottom: 15px;
        }

        @media (max-width: 500px) {
            .flashcard {
                width: 90vw;
                min-height: 280px;
            }

            h1 {
                font-size: 1.8em;
            }

            .word {
                font-size: 2em;
            }

</head>

    </div>

    <div class="controls">

        <button class="btn btn-next" onclick="nextCard()">Kitas →</button>
    </div>

        let cat = 'basics';
        let idx = 0;

        function update() {
            const w = VOCAB[cat][idx];
            document.getElementById('french-word').textContent = w.fr;
            document.getElementById('pronunciation').textContent = w.pr;
            document.getElementById('lithuanian-word').textContent = w.lt;
            document.getElementById('progress').textContent = `Kortelė ${idx + 1} iš ${VOCAB[cat].length}`;
            document.getElementById('flashcard').classList.remove('flipped');
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            idx = (idx + 1) % VOCAB[cat].length;
            update();
        }

        function previousCard() {
            idx = (idx - 1 + VOCAB[cat].length) % VOCAB[cat].length;
            update();
        }

        function changeCategory(c) {
            cat = c;
            idx = 0;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            update();
        }

        function openGoogleTranslate() {
            const w = VOCAB[cat][idx];
            const url = `https://translate.google.com/?sl=fr&tl=lt&text=${encodeURIComponent(w.fr)}&op=translate`;
            window.open(url, '_blank');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') previousCard();
            if (e.key === ' ') { e.preventDefault(); flipCard(); }
        });

        update();
